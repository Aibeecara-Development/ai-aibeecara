syntax = "proto3";

package ai_service;

// Conversation messages
message HistoryItem {
  string role = 1;  // "user" | "bot"
  string text = 2;
}

message Start {
  string request_id = 1;
}

message UserText {
  string text = 1;
}

message BotText {
  string text = 1;
}

message BotAudio {
  // 16 kHz, 16-bit PCM mono frames
  bytes pcm16 = 1;
}

message Done {}

message Error {
  string message = 1;
}

// Speaking (server-streaming)
message SpeakingRequest {
  string topic = 1;                       // e.g., "General"
  string user_audio_url = 2;              // empty string => first turn (no audio)
  repeated HistoryItem history_log = 3;   // role-based chat history
  string accent = 4;                      // e.g., "american"
  string gender = 5;                      // e.g., "feminine"
  float  speed = 6;                       // e.g., 1.0
}

message SpeakingEvent {
  oneof event {
    Start    start     = 1;
    UserText user_text = 2;  // transcript back to client
    BotText  bot_text  = 3;  // model reply text
    BotAudio bot_audio = 4;  // PCM16 chunks
    Done     done      = 5;
    Error    error     = 6;
  }
}

// Topic validation
message TopicValidationRequest {
  string topic_name = 1;
}

message TopicValidationResponse {
  string validation = 1;  // "BROAD" | "NARROW"
}

// Translation
message TranslateRequest {
  string text = 1;  // source text
}

message TranslateResponse {
  string translated_text = 1;
}

// Hint
message HintRequest {
  string response_text = 1;  // the bot's response for which to generate hint(s)
}

message HintResponse {
  string hint = 1;
}

// Grammar & vocabulary evaluation
message EvaluateTranscriptRequest {
  string transcript = 1;
  string tts_accent = 2;  // e.g., "american"
  string tts_gender = 3;  // e.g., "feminine"
}

message EvaluateGrammarResponse {
  float  score                = 1;
  string corrected_transcript = 2;
  string explanation          = 3;
  string tense_used           = 4;
  bytes  corrected_audio      = 5;
}

// Per-token synonym entry
message VocabularyEntry {
  string word                         = 1;
  string cefr                         = 2;  // e.g., "A1" | "B1" | "NA"
  string pronunciation                = 3;
  string definition                   = 4;
  string example_sentence_transcript  = 5;
  bytes  example_sentence_audio       = 6;
}

// Vocabulary token with optional synonyms
message VocabularyToken {
  VocabularyEntry original = 1;
  repeated VocabularyEntry synonyms = 2; // optional; can be empty
}

// Aggregated vocabulary evaluation
message EvaluateVocabularyResponse {
  // CEFR counts, e.g., {"A1":3,"A2":0,"B1":0,"B2":0,"C1":0,"C2":0}
  map<string, int32> statistics = 1;

  // Detailed per-token analysis
  repeated VocabularyToken tokens = 2;
}

// Pronunciation evaluation
message EvaluatePronunciationRequest {
  string audio_url = 1;
  string transcript  = 2;
  string tts_accent = 3;  // e.g., "american"
  string tts_gender = 4;  // e.g., "feminine"
}

message PronunciationToken {
  uint32 score = 1; // 0-100
  string word  = 2;
  // all fields below is available if score < 1.0
  string wrong_transcript = 3;
  string corrected_transcript = 4;
  string corrected_ipa = 5;
  bytes corrected_audio = 6;
}

message EvaluatePronunciationResponse {
  uint32 overall_score = 1;
  repeated PronunciationToken tokens = 2;
}

// Service
service AiService {
  rpc ProcessSpeaking   (SpeakingRequest)         returns (stream SpeakingEvent);
  rpc ValidateTopic     (TopicValidationRequest)  returns (TopicValidationResponse);
  rpc TranslateText     (TranslateRequest)        returns (TranslateResponse);
  rpc GenerateHint      (HintRequest)             returns (HintResponse);
  rpc EvaluateGrammar   (EvaluateTranscriptRequest)  returns (EvaluateGrammarResponse);
  rpc EvaluateVocabulary (EvaluateTranscriptRequest) returns (EvaluateVocabularyResponse);
  rpc EvaluatePronunciation (EvaluatePronunciationRequest) returns (EvaluatePronunciationResponse);
}
