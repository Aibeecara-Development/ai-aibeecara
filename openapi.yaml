openapi: 3.0.3
info:
  title: AI Aibeecara
  version: 1.0.0

servers:
  - url: http://localhost:8001
    description: Local development server

paths:
  /speaking/:
    post:
      summary: Process speaking practice session
      description: |
        Combined endpoint for speaking practice that handles the complete flow:
        - Transcribes audio input if provided via URL
        - Generates an appropriate chat response based on the topic and conversation history
        - Converts the response to speech with specified voice characteristics
        - Returns the audio response as a WAV file
      operationId: speakingEndpoint
      tags:
        - Speaking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeakingInput'
            examples:
              follow_up_message:
                summary: Follow-up message with audio input
                value:
                  topic: "General"
                  audio_url: "https://storage.googleapis.com/aibeecara-dev-bucket/speaking/test-audio.wav"
                  history_log: [
                    ["user", "I wake up early"],
                    ["bot", "Good job! What do you do after?"]
                  ]
                  accent: "american"
                  gender: "feminine"
                  speed: 1.0
              first_message:
                summary: Get opening message from AI
                value:
                  topic: "General"
                  accent: "american"
                  gender: "feminine"
                  speed: 1.0
      responses:
        '200':
          description: Successfully processed speaking request
          content:
            audio/wav:
              schema:
                type: string
                format: binary
                description: Generated speech response as WAV audio file
          headers:
            Content-Disposition:
              description: Attachment filename
              schema:
                type: string
                example: 'attachment; filename="speaking_response.wav"'
            Content-Type:
              description: Audio MIME type
              schema:
                type: string
                example: 'audio/wav'
        '400':
          description: Bad request - Invalid input parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalid_speed:
                  summary: Invalid speed parameter
                  value:
                    error: "Speed must be between 0.5 and 2.0"
                missing_topic:
                  summary: Missing required topic
                  value:
                    error: "Topic is required"
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                transcription_error:
                  summary: Audio transcription failed
                  value:
                    error: "Failed to transcribe audio: Invalid audio format"
                tts_error:
                  summary: Text-to-speech conversion failed
                  value:
                    error: "TTS service unavailable"

components:
  schemas:
    SpeakingInput:
      type: object
      required:
        - topic
        - accent
        - gender
        - speed
      properties:
        topic:
          type: string
          description: The conversation topic or theme for the speaking practice session
          example: "Travel Planning"
          minLength: 1
          maxLength: 200
        audio_url:
          type: string
          description: URL to audio file for transcription (optional, empty if first message)
          format: uri
          example: "https://example.com/audio/user_speech.wav"
          default: ""
        history_log:
          type: array
          description: Conversation history
          items:
            type: array
            description: A conversation exchange
            items:
              type: string
            example: [
              ["user", "I wake up early"],
              ["bot", "Good job! What do you do after?"]
            ]
          example: [
            ["user", "I wake up early"],
            ["bot", "Good job! What do you do after?"]
          ]
        accent:
          type: string
          description: Desired accent for the text-to-speech output
          enum:
            - american
            - british
            - australian
          example: "american"
        gender:
          type: string
          description: Preferred voice gender for text-to-speech
          enum:
            - masculine
            - feminine
          example: "feminine"
        speed:
          type: number
          format: float
          description: Speech speed multiplier (0.5 = half speed, 2.0 = double speed)
          minimum: 0.5
          maximum: 2.0
          example: 1.0
          default: 1.0

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: Error message describing what went wrong
          example: "Failed to process audio file"

tags:
  - name: Speaking
    description: Endpoints for interactive speaking practice sessions